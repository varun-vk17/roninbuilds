<!doctype html>
<html lang="en">

<head>
  <!-- figma:head-start -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Page identity ───────────────────────────────────── -->
  <title>Ronin — Revenue System™ | Creative Studio Built to Sell</title>
  <meta name="description"
    content="Ronin is a revenue-based creative studio that delivers brand positioning, offer design, copywriting, and a conversion landing page — in 7 days for $499." />
  <meta name="theme-color" content="#0051f7" />

  <!-- ── Security headers (client-side) ──────────────────── -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- ── Open Graph / Social ─────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ronin — Revenue System™ | Creative Studio Built to Sell" />
  <meta property="og:description"
    content="Brand positioning, offer design, copywriting, and a conversion landing page — delivered in 7 days." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- ── Preconnect for font performance ─────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="preconnect" href="https://static.figma.com" />

  <!-- figma:head-end -->
</head>

<body>
  <!-- figma:body-start -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- figma:body-end -->
</body>

</html>
